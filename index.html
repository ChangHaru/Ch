<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hotel &amp; Hospitality Service</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#14284B;--gold:#B8964E;--ink:#262b33;--mute:#7b8490;--line:#e6e1d3}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#1a1d22;overflow:hidden;font-family:'Prompt','Noto Sans SC',sans-serif}
#stage{width:1280px;height:720px;position:absolute;left:50%;top:50%;background:#fff;overflow:hidden;color:var(--ink)}
.s{position:absolute;inset:0;display:none;padding:80px 110px 92px}
.s.on{display:block}
.s::before{content:"";position:absolute;top:0;left:110px;width:72px;height:4px;background:var(--gold)}
.s.dark{background:var(--navy);color:#f3efe4}
.tag{position:absolute;top:30px;left:110px;font-size:16px;color:var(--gold);letter-spacing:.14em;font-weight:500}
h1{font-size:64px;font-weight:700;line-height:1.2}
h2{font-size:42px;font-weight:700;color:var(--navy);margin:14px 0 24px;line-height:1.25}
.zh{font-family:'Noto Sans SC','Prompt',sans-serif;font-weight:700}
.py{color:var(--mute);font-weight:400;letter-spacing:.02em}
.dark .py{color:#b9bfcc}
.ic{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.13em}
.two{display:grid;grid-template-columns:380px 1fr;gap:80px;height:100%;align-items:center}
.lf{border-right:1px solid var(--line);padding-right:40px}
.lf .ico{font-size:52px;color:var(--navy)}.lf h2{margin:14px 0 10px;font-size:38px}
.lf .big{font-size:54px;color:var(--navy);line-height:1.2}.lf .py{font-size:22px}
.r{padding:22px 0;border-bottom:1px solid var(--line);font-size:27px;line-height:1.4}
.r b{display:block;font-size:16px;color:var(--gold);font-weight:500;letter-spacing:.12em;margin-bottom:2px}
.grid{display:grid;gap:28px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 26px;box-shadow:0 4px 14px rgba(20,40,75,.06)}
.card .e{font-size:34px;color:var(--navy)}.card .t{font-size:26px;font-weight:600;margin:6px 0;color:var(--navy)}
.card .zh{font-size:26px;color:var(--navy)}.card .d{font-size:21px;color:#555;margin-top:4px}
.v .zh{font-size:38px;color:var(--navy)}.v .py{font-size:21px}.v .t{font-size:24px;color:var(--ink);font-weight:400}
table{border-collapse:collapse;width:100%;font-size:26px}
th{color:var(--gold);font-weight:500;font-size:16px;letter-spacing:.12em;text-align:left;padding:10px 14px;border-bottom:1px solid var(--gold)}
td{padding:18px 14px;border-bottom:1px solid var(--line)}td.zh{font-size:30px;color:var(--navy)}td.py{font-size:21px;font-weight:400}
ul.l{list-style:none;padding:0;columns:2;column-gap:60px}
ul.l li{font-size:30px;padding:22px 0 22px 52px;position:relative;border-bottom:1px solid var(--line);break-inside:avoid}
ul.l li .e{position:absolute;left:0;top:22px;color:var(--navy);font-size:32px}
.org{display:flex;flex-direction:column;align-items:center;margin-top:10px}
.gm{background:var(--navy);color:#f3efe4;padding:14px 44px;border-radius:10px;font-size:24px;text-align:center;line-height:1.5}
.gm .zh{color:#e3cf9d}
.vl{width:1px;height:28px;background:var(--gold)}.hl{width:calc(100% - 124px);height:1px;background:var(--gold)}
.dp{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;width:100%;margin-top:16px}
.dp div{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 4px;text-align:center;font-size:17px;line-height:1.35}
.dp div::before{content:"";position:absolute;top:-17px;left:50%;height:16px;width:1px;background:var(--gold)}
.dp .zh{font-size:21px;color:var(--navy)}.dp i{display:block;font-style:normal;font-size:30px;color:var(--navy);margin-bottom:6px}
.dlg{display:flex;flex-direction:column;gap:26px}
.b{max-width:84%;padding:14px 24px;font-size:23px;line-height:1.4;border-radius:12px}
.b .zh{font-size:32px}.b .py{font-size:19px}
.who{font-size:15px;letter-spacing:.1em;color:var(--gold);font-weight:500}
.g{align-self:flex-start;background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold)}
.w{align-self:flex-end;background:#eef1f6;border-left:4px solid var(--navy)}
.w .zh{color:var(--navy)}
.steps{display:flex;gap:16px;margin-top:10px}
.st{flex:1;background:#fff;border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:12px;padding:22px 12px;text-align:center;font-size:21px;line-height:1.4}
.st .e{display:block;font-size:40px;color:var(--navy);margin-bottom:6px}.st b{display:block;font-size:25px;color:var(--navy);margin-bottom:6px;font-weight:600}.st .zh{font-size:22px}
.sec{display:flex;align-items:center;gap:56px;height:100%}
.sec .n{font-size:150px;font-weight:300;color:var(--gold);line-height:1;padding-right:56px;border-right:1px solid rgba(184,150,78,.5)}
.sec h1{letter-spacing:.06em;font-size:58px}.sec .th{font-size:32px;margin:14px 0 6px}.sec .zh{font-size:30px;color:#e3cf9d}.sec .py{font-size:21px}
.ttl{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;height:100%}
.ttl .ln{width:80px;height:1px;background:var(--gold);margin-bottom:34px}
.ttl h1{color:#d9bf7c;letter-spacing:.14em;font-size:56px;font-weight:600}
.ttl .th{font-size:34px;margin-top:22px}.ttl .zh{font-size:28px;color:#e3cf9d;margin-top:8px}.ttl .py{font-size:19px}
.fill{display:flex;gap:44px;margin-top:56px}
.fill span{width:230px;border-top:1px solid var(--gold);padding-top:6px;font-size:16px;color:#b9bfcc;letter-spacing:.1em}
#ft{position:absolute;left:110px;right:110px;bottom:0;height:56px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--mute);letter-spacing:.16em;z-index:5}
#ft div{display:flex;align-items:center;gap:16px}
#ft button{font:500 14px 'Prompt',sans-serif;letter-spacing:.08em;background:none;color:var(--navy);border:1px solid var(--navy);border-radius:4px;padding:5px 16px;cursor:pointer}
#ft button:hover{background:var(--navy);color:#fff}
#pg{font-size:17px;color:var(--navy);letter-spacing:.1em;min-width:70px;text-align:center}
.dk #ft{border-color:rgba(184,150,78,.4);color:#b9bfcc}.dk #ft button{color:#f3efe4;border-color:#b9bfcc}.dk #ft button:hover{background:#f3efe4;color:var(--navy)}.dk #pg{color:#d9bf7c}

.ttl h1{font-size:48px}.ttl .th{font-size:28px;margin-top:16px}.ttl .zh{font-size:23px;margin-top:6px}.ttl .ln{margin-bottom:26px}
.fill,.mem{display:grid;gap:34px;width:100%}.fill{grid-template-columns:repeat(3,1fr);margin-top:34px}.mem{grid-template-columns:repeat(3,1fr);gap:20px 34px}
.ed{min-height:30px;border-bottom:1px solid var(--gold);font-size:20px;color:#f3efe4;outline:none;text-align:center;line-height:30px}
.ed:focus{background:rgba(255,255,255,.06)}
.ttl small{display:block;margin-top:5px;font-size:13px;color:#b9bfcc;letter-spacing:.1em}
.mh{margin:32px 0 14px;font-size:15px;color:#d9bf7c;letter-spacing:.14em}.mh .py{letter-spacing:.04em;font-size:14px}
.rp{display:grid;grid-template-columns:250px 1fr;gap:40px;padding:22px 0;border-bottom:1px solid var(--line);align-items:center}
.rl{display:grid;grid-template-columns:34px 1fr;gap:2px 12px}.rl .e{font-size:28px;color:var(--navy);grid-row:span 2}
.rl b{font-size:19px;color:var(--navy);font-weight:600;line-height:1.3}.rl small{font-size:15px;color:var(--mute)}
.rp.gu .e,.rp.gu b{color:var(--gold)}
.rp .zh{font-size:29px;color:var(--navy);line-height:1.4}.rp .py{font-size:18px}.rp .th{font-size:21px;margin-top:2px}
.rr{display:flex;gap:22px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.rr .n{color:var(--gold);font-size:22px;width:24px}.rr b{font-size:20px;font-weight:500;display:block;line-height:1.35}
.rr .zh{font-size:19px;color:var(--navy)}.rr .py{font-size:16px}.sc{margin-top:22px;font-size:20px;color:#555;line-height:1.55}
</style></head><body>

const deck=document.getElementById('deck'),st=document.getElementById('stage');
slides.forEach(s=>{const d=document.createElement('section');d.className='s'+(s.dark?' dark':'');d.innerHTML=ic((s.tag?`<div class="tag">${s.tag}</div>`:'')+s.h);deck.appendChild(d)});
const els=[...deck.children];let i=0;const p=n=>String(n).padStart(2,'0');
function go(n){i=Math.max(0,Math.min(els.length-1,n));els.forEach((e,k)=>e.classList.toggle('on',k===i));st.classList.toggle('dk',!!slides[i].dark);document.getElementById('pg').textContent=p(i+1)+' / '+p(els.length);location.hash=i+1}
document.getElementById('pv').onclick=()=>go(i-1);
document.getElementById('nx').onclick=()=>go(i+1);
addEventListener('keydown',e=>{if(e.target.isContentEditable)return;if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown')go(i+1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(i-1);if(e.key==='Home')go(0);if(e.key==='End')go(els.length-1)});
function fit(){const k=Math.min(innerWidth/1280,innerHeight/720);st.style.transform=`translate(-50%,-50%) scale(${k})`}
addEventListener('resize',fit);fit();
go((parseInt(location.hash.slice(1))||1)-1);
</script></body></html>
